name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: carecommand
          POSTGRES_USER: carecommand
          POSTGRES_PASSWORD: carecommand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carecommand -d carecommand"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://carecommand:carecommand@localhost:5432/carecommand?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run api:typecheck
      - run: npm run lint
      - run: npm run build
