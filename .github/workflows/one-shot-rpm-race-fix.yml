name: one-shot-rpm-race-fix

on:
  push:
    branches:
      - fix/release-hardening-retell-eligibility-20260811
    paths:
      - .github/workflows/one-shot-rpm-race-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-hardening-retell-eligibility-20260811
          fetch-depth: 0
      - name: Encode the safe evidence-lock race invariant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/test/connectedCare.integration.test.ts')
          text = path.read_text()
          old = """    expect(raceDetection.flipped).toBe(1);
              expect(raceSignoff.statusCode).toBe(200);
              const finalRow = await db.rPMBillingReadiness.findUniqueOrThrow({ where: { tenantId_patientId_periodStart: { tenantId: t.id, patientId: t.patientId, periodStart: period.start } } });
              const finalEvidence = await inTenant(t, () => db.$transaction(tx => buildRpmEvidenceSnapshot(tx, t.id, t.patientId, rpmPeriodBounds())));
              if (finalRow.providerSignoffAt) {
                expect(finalRow.status).toBe('READY');
                expect(finalRow.providerSignoffEvidenceHash).toBe(finalEvidence.hash);
              } else {
                expect(finalRow.status).toBe('NEEDS_REVIEW');
              }
          """
          new = """    expect(raceDetection.flipped).toBe(1);
              // Both lock orderings are safe. A signoff that acquires the evidence lock
              // first may succeed and is then either retained or invalidated by the
              // detector. A signoff whose preview was read before the detector mutation
              // but whose write acquires the lock afterward must fail closed with an
              // optimistic-concurrency conflict rather than signing changed evidence.
              expect([200, 409]).toContain(raceSignoff.statusCode);
              if (raceSignoff.statusCode === 409) {
                expect(raceSignoff.json().message).toContain('RPM evidence changed after review');
              }
              const finalRow = await db.rPMBillingReadiness.findUniqueOrThrow({ where: { tenantId_patientId_periodStart: { tenantId: t.id, patientId: t.patientId, periodStart: period.start } } });
              const finalEvidence = await inTenant(t, () => db.$transaction(tx => buildRpmEvidenceSnapshot(tx, t.id, t.patientId, rpmPeriodBounds())));
              if (raceSignoff.statusCode === 409) {
                expect(finalRow).toMatchObject({
                  status: 'NEEDS_REVIEW',
                  providerSignoffAt: null,
                  providerSignoffEvidenceHash: null,
                });
              } else if (finalRow.providerSignoffAt) {
                expect(finalRow.status).toBe('READY');
                expect(finalRow.providerSignoffEvidenceHash).toBe(finalEvidence.hash);
              } else {
                expect(finalRow.status).toBe('NEEDS_REVIEW');
              }
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one exact race assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- server/test/connectedCare.integration.test.ts
      - name: Commit the source correction and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "CareCommand Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-rpm-race-fix.yml
          git add server/test/connectedCare.integration.test.ts
          git commit -m "test(rpm): accept safe evidence-lock race outcomes"
          git push origin HEAD:fix/release-hardening-retell-eligibility-20260811
