<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: operational-briefing.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>

<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1505px">
  <div class="r-sidebar-ground region chrome" data-region="sidebar-ground"><!-- deep navy navigation rail --></div>
  <div class="r-brand region text" data-region="brand"><!-- CareCommand AI brand lockup --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-nav-primary region control" data-region="nav-primary"><!-- Today through Administration navigation labels, icons, active state and count badges: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-primary); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-sidebar-proof region control" data-region="sidebar-proof"><!-- Open PHI-safe executive proof callout with synthetic source-labelled note: rebuild the control's chrome from the crop (comp-spec.mjs --crop sidebar-proof); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-topbar-ground region chrome" data-region="topbar-ground"><!-- white top utility bar with bottom hairline --></div>
  <div class="r-global-search region control" data-region="global-search"><!-- search patients callers tickets and more field with shortcut: rebuild the control's chrome from the crop (comp-spec.mjs --crop global-search); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-topbar-user region control" data-region="topbar-user"><!-- notification help and Olivia Bennett user controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop topbar-user); its ink box, border, fill, radius, and label size are the comp's --></div>

  <div class="r-clinic-selector region control" data-region="clinic-selector"><!-- All 4 clinics selector at upper right: rebuild the control's chrome from the crop (comp-spec.mjs --crop clinic-selector); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-page-title region text" data-region="page-title"><!-- Operational Briefing display heading --><p style="font-size:var(--r-page-title-font);font-family:var(--r-page-title-family),sans-serif;font-weight:var(--r-page-title-weight);line-height:1.05;margin:0">page-title</p></div>
  <div class="r-page-context region text" data-region="page-context"><!-- Tuesday 1 September and synthetic pilot workspace context --><p style="font-size:var(--r-page-context-font);line-height:1.05;margin:0">page-context</p></div>

  <div class="r-priority-ground region chrome" data-region="priority-ground"><!-- single connected morning-priority surface divided into three actions --></div>
  <div class="r-brief-summary region text" data-region="brief-summary"><!-- three items need attention before the opening window --><p style="font-size:var(--r-brief-summary-font);line-height:1.05;margin:0">brief-summary</p></div>

  <div class="r-ledger-row-four region control" data-region="ledger-row-four"><!-- Harley Street unknown caller with owner live evidence and assign action: rebuild the control's chrome from the crop (comp-spec.mjs --crop ledger-row-four); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-ledger-row-five region control" data-region="ledger-row-five"><!-- network scheduling API latency service item with monitoring source and resolve action: rebuild the control's chrome from the crop (comp-spec.mjs --crop ledger-row-five); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-ledger-pagination region control" data-region="ledger-pagination"><!-- five-record count and pagination controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop ledger-pagination); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-connection-ground region chrome" data-region="connection-ground"><!-- connection health evidence surface --></div>
  <div class="r-connection-title region text" data-region="connection-title"><!-- Connection health heading and information affordance --><p style="font-size:var(--r-connection-title-font);line-height:1.05;margin:0">connection-title</p></div>
