# Render Blueprint (Infrastructure as Code) for CareCommand AI.
# Deploy via Render → New → Blueprint, pointed at this repo/branch. Defines the
# API web service, the always-on background worker (drains the BullMQ queues),
# and a managed Key Value (Redis) instance. Secrets are set in the dashboard.
#
# ══════════════════════════════════════════════════════════════════════════
# DEPLOYMENT POSTURE: DEMO-GRADE AS WRITTEN — NOT FIT FOR ENTERPRISE VALIDATION
#
# This blueprint ships DEPLOYMENT_PROFILE=demo with mock payments/insurance/AI
# and FREE plans. Free-plan services spin down after ~15 min idle (cold starts,
# dropped webhooks, no HA) and free Key Value is non-persistent — that alone
# disqualifies this file, unmodified, for any enterprise validation cycle.
# Before pointing a pilot or enterprise validation at this blueprint:
#   1. Upgrade every `plan: free` to an always-on paid plan.
#   2. Set DEPLOYMENT_PROFILE=pilot|enterprise. The app then REFUSES TO BOOT
#      while any integration is still mock unless explicitly acknowledged via
#      ALLOWED_MOCK_INTEGRATIONS (enterprise never allows mock payments).
#   3. Record every integration's mode (live/sandbox/mock/not-configured) per
#      docs/INTEGRATION_MODE_REGISTER.md — buyer-facing claims must not mix
#      modes. Verify the live posture at GET /health/integrations.
# ══════════════════════════════════════════════════════════════════════════
#
# NOTE: this lives on the feature branch — merge to `main` (or connect the
# Blueprint to this branch) before deploying.

services:
  # ── Managed Redis (queues + rate limiting) ────────────────────────────────
  - type: keyvalue
    name: carecommand-redis
    region: oregon
    plan: free            # demo only; upgrade for enterprise validation/persistence/HA
    ipAllowList: []       # internal-only (reachable by the services below)
    maxmemoryPolicy: noeviction   # required by BullMQ

  # ── API (Fastify, serverless-style web service) ───────────────────────────
  - type: web
    name: carecommand-ai
    runtime: node
    region: oregon
    plan: free            # demo only; upgrade for enterprise validation (no spindown)
    # prisma CLI is a prod dependency, so `npm ci` (which omits devDeps under
    # NODE_ENV=production) still installs it. db:deploy runs migrations here
    # because preDeployCommand is a paid-plan-only feature (skipped on free).
    buildCommand: npm ci && npm run db:generate && npm run db:deploy
    startCommand: npm run api:start
    healthCheckPath: /health/live          # liveness; /health/ready 503s until Redis is wired
    autoDeploy: true
    envVars:
      - fromGroup: carecommand-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: carecommand-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false        # set to your frontend origin, e.g. https://app.vercel.app
      - key: PUBLIC_API_URL
        sync: false        # https://carecommand-ai.onrender.com
      - key: PUBLIC_APP_URL
        sync: false        # exact tenant UI origin, e.g. https://carecommand.kodekinetics.com

  # ── Background worker (autopilot + compliance + campaign queues) ───────────
  - type: worker
    name: carecommand-worker
    runtime: node
    region: oregon
    plan: starter         # do NOT use free — a spun-down worker never drains the queue
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:start
    autoDeploy: true
    # NOTE: Render workers accept no inbound traffic, so the worker's /metrics
    # listener (WORKER_METRICS_PORT) is not scrapable here. Job metrics need a
    # private service + in-network Prometheus/agent, or another host. See
    # docs/OBSERVABILITY.md#worker-metrics.
    envVars:
      - fromGroup: carecommand-shared
      - key: OTEL_SERVICE_NAME
        value: carecommand-worker
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: carecommand-redis
          property: connectionString

# ── Shared env (same DB/secrets across API + worker) ─────────────────────────
envVarGroups:
  - name: carecommand-shared
    envVars:
      - key: NODE_ENV
        value: production
      # Deployment posture gate (see header block). 'demo' is truthful for this
      # blueprint as written. Flip to 'pilot'/'enterprise' ONLY after replacing
      # the mock providers below (or acknowledging them via
      # ALLOWED_MOCK_INTEGRATIONS) — otherwise the app fails boot by design.
      - key: DEPLOYMENT_PROFILE
        value: demo
      - key: QUEUES_ENABLED
        value: "true"
      - key: QUEUE_NAMESPACE
        value: carecommand-render
      - key: RLS_ENFORCE_RUNTIME_ROLE
        value: "false"     # enterprise validation/prod: set true after DATABASE_URL uses app_rls
      - key: PLATFORM_LEGACY_TOKEN_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: AI_PROVIDER
        value: mock
      - key: INSURANCE_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
      # Secrets — set in the Render dashboard (Neon connection strings):
      - key: DATABASE_URL
        sync: false        # postgresql://<role>:<pw>@<neon-host>/<db>?sslmode=require
      - key: DATABASE_MIGRATION_URL
        sync: false        # Neon OWNER role (used only by migrations)
      # Auto-generated 32+ char secrets (shared by the group):
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AUTH_ENCRYPTION_KEY
        generateValue: true
